name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: platane/snk@v3
        with:
          github_user_name: HARSHIT071004
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=orange&color_dots=#e2e8f0,#cbd5e1,#94a3b8,#6366f1,#4f46e5

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
