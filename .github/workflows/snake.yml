name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output
          path: output

      - uses: platane/snk@v3
        with:
          github_user_name: HARSHIT071004
          outputs: |
            output/github-contribution-grid-snake-dark.svg?color_snake=orange&color_dots=#e2e8f0,#cbd5e1,#94a3b8,#6366f1,#4f46e5

      - name: Push to output branch
        run: |
          cd output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "update snake"
          git push
